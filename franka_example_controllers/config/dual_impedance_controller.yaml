# Dual Impedance Controller Configuration

# This parameter is used outside the controller namespace
default_mode: false  # Start in joint mode (true = cartesian, false = joint) for smoother startup

dual_impedance_controller:
  type: franka_example_controllers/DualImpedanceController
  
  # Robot parameters
  arm_id: "panda"
  joint_names:
    - panda_joint1
    - panda_joint2
    - panda_joint3
    - panda_joint4
    - panda_joint5
    - panda_joint6
    - panda_joint7

  # ========== Mode Transition Parameters ==========
  transition_duration: 2.0  # Smooth transition time between modes (seconds)

  # ========== Cartesian Impedance Parameters ==========
  # Stiffness parameters (N/m for translation, Nm/rad for rotation)
  cartesian_stiffness:
    translational_stiffness_X: 400.0  # Significantly reduced stiffness to avoid discontinuities
    translational_stiffness_Y: 400.0  # Significantly reduced stiffness to avoid discontinuities
    translational_stiffness_Z: 400.0  # Significantly reduced stiffness to avoid discontinuities
    rotational_stiffness_X: 10.0  # Significantly reduced rotational stiffness
    rotational_stiffness_Y: 10.0  # Significantly reduced rotational stiffness
    rotational_stiffness_Z: 10.0  # Significantly reduced rotational stiffness

  # Nullspace stiffness
  nullspace_stiffness: 10.0

  # ========== Joint Impedance Parameters ==========
  # Joint impedance gains
  joint_kp: [150.0, 150.0, 150.0, 150.0, 120.0, 250.0, 80.0]  # Further reduced proportional gains
  joint_kd: [20.0, 20.0, 20.0, 20.0, 10.0, 15.0, 8.0]  # Increased damping for smoother motion

  # Maximum delta position per control cycle (rad)
  max_delta_q: [0.04, 0.04, 0.04, 0.04, 0.05, 0.05, 0.05]  # Significantly reduced for smoother transitions

  # Joint limits
  joint_limits_upper: [2.8973, 1.7628, 2.8973, -0.0698, 2.8973, 3.7525, 2.8973]
  joint_limits_lower: [-2.8973, -1.7628, -2.8973, -3.0718, -2.8973, -0.0175, -2.8973]
  joint_limit_margin: 0.1

  # ========== Common Parameters ==========
  # Publishing rate for diagnostics
  publish_rate: 30.0

  # Coriolis compensation factor
  coriolis_factor: 1.0

  # State estimation smoothing factors
  alpha_q: 0.98      # Position smoothing (0-1, higher = more smoothing)
  alpha_dq: 0.98     # Velocity smoothing (0-1, higher = more smoothing)

  # Trajectory interpolation
  time_fraction: 0.5  # Further reduced for even smoother motions
  startup_duration: 40.0  # Increased startup duration for even more gradual ramp-up

  # Power and torque limits
  power_limit: 70.0  # Reduced power limit to prevent reflex triggering
  power_limit_startup: 35.0  # Reduced startup power limit to 50% of max
  tau_limit: 87.0

  # ========== Joint Mode Specific ==========
  # External command mode settings
  use_external_command: true
  is_delta: false  # false = absolute positions, true = relative positions

  # Trajectory motion parameters
  radius: 0.15       # Increased radius for smoother corner transitions
  vel_max: 0.15      # Reduced maximum velocity
  acceleration_time: 3.0  # Increased acceleration time for gentler changes
