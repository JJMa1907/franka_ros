# Joint Impedance Controller Configuration matching deoxys_control/deoxys/config/joint-impedance-controller.yml

joint_impedance_example_controller:
    type: franka_example_controllers/JointImpedanceExampleController
    arm_id: $(arg arm_id)
    joint_names:
        - $(arg arm_id)_joint1
        - $(arg arm_id)_joint2
        - $(arg arm_id)_joint3
        - $(arg arm_id)_joint4
        - $(arg arm_id)_joint5
        - $(arg arm_id)_joint6
        - $(arg arm_id)_joint7
    
    # Joint impedance parameters from deoxys config
    joint_kp: [300.0, 300.0, 300.0, 300.0, 225.0, 450.0, 150.0]
    joint_kd: [20.0, 20.0, 20.0, 20.0, 7.5, 15.0, 5.0]
    max_delta_q: [0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06]
    
    # State estimation parameters (exponential smoothing)
    alpha_q: 0.9
    alpha_dq: 0.9
    
    # Trajectory interpolation parameter
    time_fraction: 1.0
    
    # Original franka_example_controllers parameters
    radius: 0.1
    acceleration_time: 2.0
    vel_max: 0.15
    publish_rate: 30.0
    coriolis_factor: 1.0
    use_external_command: true
